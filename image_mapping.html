<!DOCTYPE html>
<html>

<head>
    <title>image mapping</title>
</head>

<body>
    <img src="4colors.jpg" usemap="#512" alt="color">
    <map name="512">
        <area shape="rec" coords="0,0,254,250" alt="error" href="https://www.amazon.in">
        <area shape="rec" coords="255,1,511,251 alt=error" href="https://www.flipkart.com">
        <area shape="rec" coords="0,252,253,511" alt="error" href="https://www.ajio.com">
        <area shape="rec" coords="255,253,511,511" alt="error" href="https://www.spotify.com">
    </map>
</body>

</html>
